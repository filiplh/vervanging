<!--
  Custom SF Symbol "court" for the Match tab (issue #138), in Apple's symbol template format.
  Open it in the SF Symbols app to edit it, or edit the drawing below and outline it again.

  The owner's drawing (option A, 2026-11-24), a 120 x 80 grid, strokes only, round caps and joins, stroke width 5.5:
    <rect x="4" y="4" width="112" height="72" rx="7"/>
    <line x1="60" y1="4" x2="60" y2="76"/>
    <circle cx="60" cy="40" r="11"/>
    <path d="M4 27 H29 V53 H4"/>
    <path d="M29 30 A10 10 0 0 1 29 50"/>
    <path d="M116 27 H91 V53 H116"/>
    <path d="M91 30 A10 10 0 0 0 91 50"/>

  Each variant is that drawing with its strokes outlined, scaled as a whole (the stroke keeps its proportion to the
  court) to the ink height, vertical centre and side margins of the system's `sportscourt` at that scale.
-->
